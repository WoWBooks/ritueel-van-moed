<!DOCTYPE html>

<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Ritueel van Moed - Vraag 2</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Cinzel:wght@400;500&display=swap" rel="stylesheet">

<style>
  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  :root {
    --gold: #c9a84c;
    --gold-light: #e8d08a;
    --gold-dim: #7a5e2a;
    --black: #080808;
    --text: #e8d9b8;
    --draw-time: 150s;
  }

  html, body {
    height: 100%;
    background: var(--black);
    color: var(--text);
    font-family: 'Cormorant Garamond', Georgia, serif;
    overflow: hidden;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100dvh;
    padding: 2rem 1.5rem;
    position: relative;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    opacity: 0.35;
    z-index: 0;
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.72) 100%);
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2.1rem;
    width: 100%;
    max-width: 390px;
    text-align: center;
  }

  .title {
    font-family: 'Cinzel', serif;
    font-size: clamp(1rem, 4.2vw, 1.3rem);
    font-weight: 400;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--gold);
    opacity: 0;
    animation: fadeUp 1.2s ease 0.3s forwards;
  }

  .divider {
    width: 60px;
    height: 1px;
    background: linear-gradient(to right, transparent, var(--gold-dim), transparent);
    opacity: 0;
    animation: fadeIn 1s ease 0.8s forwards;
  }

  .question {
    font-size: clamp(1.25rem, 5vw, 1.65rem);
    font-style: italic;
    font-weight: 300;
    line-height: 1.5;
    color: var(--text);
    opacity: 0;
    animation: fadeUp 1.2s ease 1s forwards;
    letter-spacing: 0.02em;
  }

  .subtext {
    font-size: clamp(1rem, 4vw, 1.18rem);
    font-weight: 300;
    line-height: 1.45;
    color: rgba(232, 217, 184, 0.78);
    opacity: 0;
    animation: fadeUp 1.2s ease 1.35s forwards;
  }

  .lemniscate-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    animation: fadeIn 0.8s ease 1.8s forwards;
    padding: 0.2rem 0;
  }

  .lemniscate-svg {
    overflow: visible;
  }

  .lem-path {
    fill: none;
    stroke: var(--gold);
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    filter: drop-shadow(0 0 6px rgba(201, 168, 76, 0.45));
  }

  .timer-text {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 0.95rem;
    color: rgba(232, 217, 184, 0.62);
    opacity: 0;
    animation: fadeIn 1s ease 2.2s forwards;
  }

  .btn-verder {
    font-family: 'Cinzel', serif;
    font-size: 0.82rem;
    font-weight: 400;
    letter-spacing: 0.26em;
    text-transform: uppercase;
    color: var(--gold);
    background: transparent;
    border: 1px solid var(--gold-dim);
    padding: 0.85rem 2.2rem;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    opacity: 0;
    pointer-events: none;
    transition: color 0.4s, border-color 0.4s, box-shadow 0.4s;
    -webkit-tap-highlight-color: transparent;
  }

  .btn-verder::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(201,168,76,0.08), rgba(201,168,76,0));
    opacity: 0;
    transition: opacity 0.4s;
  }

  .btn-verder:hover,
  .btn-verder:active {
    border-color: var(--gold);
    box-shadow: 0 0 18px rgba(201,168,76,0.18), inset 0 0 12px rgba(201,168,76,0.06);
    color: var(--gold-light);
  }

  .btn-verder.visible {
    animation: fadeUp 1s ease forwards;
    pointer-events: auto;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  .lem-path.drawing {
    animation: drawLem var(--draw-time) linear forwards;
  }

  @keyframes drawLem {
    from { stroke-dashoffset: var(--path-length); }
    to   { stroke-dashoffset: 0; }
  }
</style>

</head>

<body>

<div class="container">
  <div class="title">Ritueel van Moed</div>
  <div class="divider"></div>

  <div class="question">
    Wat leeft al langer in jou,<br>
    maar heeft nog geen woorden gekregen?
  </div>

  <div class="subtext">
    Adem rustig.<br>
    Laat het antwoord niet uit je hoofd komen,<br>
    maar uit de plek waar het al die tijd heeft gewacht.
  </div>

  <div class="lemniscate-wrap">
    <svg class="lemniscate-svg" width="210" height="105" viewBox="-105 -55 210 110">
      <path
        class="lem-path"
        id="lemPath"
        d="M 0 0
           C 42 -36, 95 -36, 95 0
           C 95 36, 42 36, 0 0
           C -42 -36, -95 -36, -95 0
           C -95 36, -42 36, 0 0"
      />
    </svg>
  </div>

  <div class="timer-text" id="timerText">
    Neem 2,5 minuut voor deze vraag.
  </div>

  <button class="btn-verder" id="btnVerder" aria-label="Ga verder">
    Verder
  </button>
</div>

<script>
  (function() {
    const drawTime = 150000;

    const path = document.getElementById('lemPath');
    const length = path.getTotalLength();

    path.style.strokeDasharray = length;
    path.style.strokeDashoffset = length;
    path.style.setProperty('--path-length', length);

    const btn = document.getElementById('btnVerder');
    const timerText = document.getElementById('timerText');

    setTimeout(() => {
      path.classList.add('drawing');

      setTimeout(() => {
        timerText.textContent = 'Wanneer je klaar bent, mag je verder.';
        btn.classList.add('visible');
      }, drawTime);

    }, 2600);

    btn.addEventListener('click', () => {
      window.location.href = "vraag-3.html";
    });
  })();
</script>

</body>
</html>

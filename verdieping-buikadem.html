<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Verdieping – Buikadem</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Cinzel:wght@400;500&display=swap" rel="stylesheet">

<style>
  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  :root {
    --gold: #c9a84c;
    --gold-light: #e8d08a;
    --gold-dim: #7a5e2a;
    --black: #080808;
    --text: #e8d9b8;

    /* Tijdsduur per zijde in seconden */
    --side-time: 7s;
  }

  html, body {
    height: 100%;
    background: var(--black);
    color: var(--text);
    font-family: 'Cormorant Garamond', Georgia, serif;
    overflow: hidden;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100dvh;
    padding: 2rem 1.5rem;
    position: relative;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    opacity: 0.35;
    z-index: 0;
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.72) 100%);
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2rem;
    width: 100%;
    max-width: 390px;
    text-align: center;
  }

  .title {
    font-family: 'Cinzel', serif;
    font-size: clamp(1rem, 4.2vw, 1.3rem);
    font-weight: 400;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--gold);
    opacity: 0;
    animation: fadeUp 1.2s ease 0.3s forwards;
  }

  .divider {
    width: 60px;
    height: 1px;
    background: linear-gradient(to right, transparent, var(--gold-dim), transparent);
    opacity: 0;
    animation: fadeIn 1s ease 0.8s forwards;
  }

  .question {
    font-size: clamp(1.25rem, 5vw, 1.65rem);
    font-style: italic;
    font-weight: 300;
    line-height: 1.5;
    color: var(--text);
    opacity: 0;
    animation: fadeUp 1.2s ease 1s forwards;
    letter-spacing: 0.02em;
  }

  .subtext {
    font-size: clamp(1rem, 4vw, 1.18rem);
    font-weight: 300;
    line-height: 1.55;
    color: rgba(232, 217, 184, 0.78);
    opacity: 0;
    animation: fadeUp 1.2s ease 1.35s forwards;
  }

  /* Vierkant-wrapper */
  .square-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    animation: fadeIn 0.8s ease 1.8s forwards;
    padding: 0.4rem 0;
    position: relative;
  }

  .square-svg {
    overflow: visible;
  }

  /* De vierkante ademlijn */
  .sq-path {
    fill: none;
    stroke: var(--gold);
    stroke-width: 1.5;
    stroke-linecap: square;
    stroke-linejoin: miter;
    filter: drop-shadow(0 0 6px rgba(201, 168, 76, 0.45));
  }

  /* Ademlabel — zweeft bij de actieve zijde */
  .adem-label {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: clamp(0.95rem, 3.8vw, 1.1rem);
    font-style: italic;
    font-weight: 300;
    color: rgba(232, 217, 184, 0.85);
    min-height: 1.6em;
    opacity: 0;
    transition: opacity 0.6s ease;
    letter-spacing: 0.04em;
  }

  .adem-label.zichtbaar {
    opacity: 1;
  }

  /* Startknop */
  .btn-start {
    font-family: 'Cinzel', serif;
    font-size: 0.82rem;
    font-weight: 400;
    letter-spacing: 0.26em;
    text-transform: uppercase;
    color: var(--gold);
    background: transparent;
    border: 1px solid var(--gold);
    padding: 0.85rem 2.2rem;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    opacity: 0;
    animation: fadeUp 1.2s ease 1.8s forwards;
    transition: color 0.4s, border-color 0.4s, box-shadow 0.4s;
    -webkit-tap-highlight-color: transparent;
  }

  .btn-start:hover,
  .btn-start:active {
    border-color: var(--gold-light);
    box-shadow: 0 0 18px rgba(201,168,76,0.18), inset 0 0 12px rgba(201,168,76,0.06);
    color: var(--gold-light);
  }

  .btn-start.verborgen {
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.6s ease;
  }

  /* Knop */
  .btn-verder {
    font-family: 'Cinzel', serif;
    font-size: 0.82rem;
    font-weight: 400;
    letter-spacing: 0.26em;
    text-transform: uppercase;
    color: var(--gold);
    background: transparent;
    border: 1px solid var(--gold-dim);
    padding: 0.85rem 2.2rem;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    opacity: 0;
    pointer-events: none;
    transition: color 0.4s, border-color 0.4s, box-shadow 0.4s;
    -webkit-tap-highlight-color: transparent;
  }

  .btn-verder::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(201,168,76,0.08), rgba(201,168,76,0));
    opacity: 0;
    transition: opacity 0.4s;
  }

  .btn-verder:hover,
  .btn-verder:active {
    border-color: var(--gold);
    box-shadow: 0 0 18px rgba(201,168,76,0.18), inset 0 0 12px rgba(201,168,76,0.06);
    color: var(--gold-light);
  }

  .btn-verder.visible {
    animation: fadeUp 1s ease forwards;
    pointer-events: auto;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
</style>
</head>

<body>

<div class="container">
  <div class="title">Verdieping</div>
  <div class="divider"></div>

  <div class="question">Van je hoofd naar je buik.</div>

  <div class="subtext">
    Volg het vierkant met je adem.<br>
    Niet forceren. Alleen zakken.
  </div>

  <div class="square-wrap">
    <!--
      Vierkant: linksboven (0,0) → rechtsboven (110,0) → rechtsonder (110,110) → linksonder (0,110) → terug linksboven (0,0)
      Zijde 1 (boven):    M 0 0   → L 110 0     = adem in
      Zijde 2 (rechts):   L 110 0 → L 110 110   = adem uit 7 tellen
      Zijde 3 (onder):    L 110 110 → L 0 110   = adem in 7 tellen
      Zijde 4 (links):    L 0 110 → L 0 0       = adem uit 7 tellen
    -->
    <svg class="square-svg" width="150" height="150" viewBox="-20 -20 150 150">
      <path
        class="sq-path"
        id="sqPath"
        d="M 0 0 L 110 0 L 110 110 L 0 110 Z"
      />
    </svg>
  </div>

  <button class="btn-start" id="btnStart" aria-label="Start de ademhaling">
    Start de ademhaling
  </button>

  <div class="adem-label" id="ademLabel">&nbsp;</div>

  <button class="btn-verder" id="btnVerder" aria-label="Naar de vragen">
    Naar de vragen
  </button>
</div>

<script>
  (function () {
    const SIDE_MS = 7000;

    const path      = document.getElementById('sqPath');
    const label     = document.getElementById('ademLabel');
    const btn       = document.getElementById('btnVerder');
    const btnStart  = document.getElementById('btnStart');

    const totalLength = path.getTotalLength();
    path.style.strokeDasharray  = totalLength;
    path.style.strokeDashoffset = totalLength;
    const sideLength = totalLength / 4;

    const labels = [
      'Adem in door je neus',
      'Adem uit door je mond \u2013 7 tellen',
      'Adem in door je neus \u2013 7 tellen',
      'Adem uit door je mond \u2013 7 tellen'
    ];

    // ─── Web Audio ─────────────────────────────────────────────────────────

    let ctx, masterGain, inOsc, inGain, outOsc, outGain;

    function buildAudio() {
      ctx = new (window.AudioContext || window.webkitAudioContext)();

      // Zeer laag mastervolume — bijna niet aanwezig
      masterGain = ctx.createGain();
      masterGain.gain.setValueAtTime(0, ctx.currentTime);
      masterGain.gain.linearRampToValueAtTime(0.12, ctx.currentTime + 4);
      masterGain.connect(ctx.destination);

      // ── Inademingstoon: lichte sinus, hoog maar zacht
      //    E4 (329 Hz) — licht, open, niet opdringerig
      inGain = ctx.createGain();
      inGain.gain.setValueAtTime(0, ctx.currentTime);
      inGain.connect(masterGain);

      inOsc = ctx.createOscillator();
      inOsc.type = 'sine';
      inOsc.frequency.setValueAtTime(256, ctx.currentTime);
      inOsc.connect(inGain);
      inOsc.start();

      // ── Uitademingstoon: warmere sinus, lager
      //    A3 (220 Hz) — warm, aards, zacht
      outGain = ctx.createGain();
      outGain.gain.setValueAtTime(0, ctx.currentTime);
      outGain.connect(masterGain);

      outOsc = ctx.createOscillator();
      outOsc.type = 'sine';
      outOsc.frequency.setValueAtTime(174, ctx.currentTime);
      outOsc.connect(outGain);
      outOsc.start();
    }

    function onSideChange(side) {
      if (!ctx) return;
      const t  = ctx.currentTime;
      const TR = 3.0; // zachte overgang

      const isIn = (side === 0 || side === 2);

      if (isIn) {
        // Inademing — lichte toon opent zacht
        inGain.gain.cancelScheduledValues(t);
        inGain.gain.linearRampToValueAtTime(0.14, t + TR);
        outGain.gain.cancelScheduledValues(t);
        outGain.gain.linearRampToValueAtTime(0, t + TR);
      } else {
        // Uitademing — warmere toon zakt langzaam in
        inGain.gain.cancelScheduledValues(t);
        inGain.gain.linearRampToValueAtTime(0, t + TR);
        outGain.gain.cancelScheduledValues(t);
        outGain.gain.linearRampToValueAtTime(0.14, t + TR);
      }
    }

    function fadeOutAudio(duur = 4) {
      if (!ctx) return;
      masterGain.gain.cancelScheduledValues(ctx.currentTime);
      masterGain.gain.linearRampToValueAtTime(0, ctx.currentTime + duur);
    }

    // ─── Animatieloop ───────────────────────────────────────────────────────

    let animStart   = null;
    let currentSide = -1;

    function teken(timestamp) {
      if (!animStart) animStart = timestamp;
      const elapsed = timestamp - animStart;
      const drawn   = Math.min((elapsed / (SIDE_MS * 4)) * totalLength, totalLength);
      path.style.strokeDashoffset = totalLength - drawn;

      const side = Math.min(Math.floor(drawn / sideLength), 3);
      if (side !== currentSide) {
        currentSide = side;
        onSideChange(side);
        label.classList.remove('zichtbaar');
        setTimeout(() => {
          label.textContent = labels[side];
          label.classList.add('zichtbaar');
        }, 120);
      }

      if (drawn < totalLength) {
        requestAnimationFrame(teken);
      } else {
        label.classList.remove('zichtbaar');
        fadeOutAudio(4);
        setTimeout(() => {
          label.textContent = '';
          btn.classList.add('visible');
        }, 4200);
      }
    }

    // ─── Start op klik — alles synchroon ───────────────────────────────────

    btnStart.addEventListener('click', () => {
      btnStart.classList.add('verborgen');
      buildAudio();
      requestAnimationFrame(teken);
    });

    btn.addEventListener('click', () => {
      window.location.href = 'vraag-1.html';
    });
  })();
</script>

</body>
</html>
